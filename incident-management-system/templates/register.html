
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | IncidentHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 440px;">
        <div class="card-body p-4 p-md-5">
            <h2 class="fw-bold mb-2">Create account</h2>
            <p class="text-secondary mb-4">
                Register to report and track IT incidents.
            </p>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username"
                           name="username" minlength="3"
                           autocomplete="username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password"
                           id="password" name="password" minlength="8"
                           autocomplete="new-password" required>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="confirm_password">
                        Confirm password
                    </label>
                    <input class="form-control" type="password"
                           id="confirm_password" name="confirm_password"
                           autocomplete="new-password" required>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Create account
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                Already registered?
                <a href="{{ url_for('login') }}">Sign in</a>
            </p>

            <p class="text-center mt-3 mb-0">
                <a href="{{ url_for('landing') }}">Back to homepage</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
