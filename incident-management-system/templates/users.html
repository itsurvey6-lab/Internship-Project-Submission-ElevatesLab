
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management | IncidentHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
            IncidentHub
        </a>

        <div class="d-flex align-items-center gap-3">
            <span class="badge bg-primary">{{ current_user.role }}</span>
            <span class="text-light">{{ current_user.username }}</span>
            <a href="{{ url_for('logout') }}"
               class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold">User Management</h1>
            <p class="text-secondary mb-0">
                Manage user accounts and access roles.
            </p>
        </div>

        <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">
            Back to Dashboard
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Current Role</th>
                            <th>Change Role</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for user in users %}
                        <tr>
                            <td class="fw-semibold">{{ user.username }}</td>

                            <td>
                                <span class="badge
                                    {% if user.role == 'Admin' %}bg-danger
                                    {% elif user.role == 'Agent' %}bg-primary
                                    {% else %}bg-secondary{% endif %}">
                                    {{ user.role }}
                                </span>
                            </td>

                            <td>
                                <form method="POST"
                                      action="{{ url_for('change_user_role', user_id=user.id) }}"
                                      class="d-flex gap-2">

                                    <select name="role"
                                            class="form-select form-select-sm"
                                            aria-label="Select role for {{ user.username }}">
                                        <option value="Reporter"
                                            {% if user.role == 'Reporter' %}selected{% endif %}>
                                            Reporter
                                        </option>
                                        <option value="Agent"
                                            {% if user.role == 'Agent' %}selected{% endif %}>
                                            Agent
                                        </option>
                                        <option value="Admin"
                                            {% if user.role == 'Admin' %}selected{% endif %}>
                                            Admin
                                        </option>
                                    </select>

                                    <button type="submit"
                                            class="btn btn-primary btn-sm">
                                        Save
                                    </button>
                                </form>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="text-center text-secondary py-4">
                                No users found.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</body>
</html>
