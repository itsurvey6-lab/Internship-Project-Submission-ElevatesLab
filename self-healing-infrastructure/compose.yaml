
services:
  nginx:
    image: nginx:alpine
    container_name: selfheal-nginx
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: selfheal-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    restart: unless-stopped


  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: selfheal-blackbox
    ports:
      - "9115:9115"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: selfheal-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped

  recovery:
    image: python:3.14-slim
    container_name: selfheal-recovery
    working_dir: /app
    command: ["sh", "-c", "pip install --no-cache-dir -r requirements.txt && python -u recovery.py"]
    ports:
      - "5001:5001"
    volumes:
      - ./recovery:/app
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
